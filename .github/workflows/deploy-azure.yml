name: Deploy to Microsoft Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  AZURE_WEBAPP_NAME: 'omnistore-api' # Replace with your Azure App Service name

jobs:
  # =========================================================================
  # 1. DEPLOY BACKEND: ASP.NET Core 8 Web API -> Azure App Service
  # =========================================================================
  deploy-backend:
    name: Deploy Backend (.NET 8 -> Azure App Service)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore backend/BopisRetail.Api.csproj

      - name: Build Backend (Release)
        run: dotnet build backend/BopisRetail.Api.csproj --configuration Release --no-restore

      - name: Publish Backend Package
        run: dotnet publish backend/BopisRetail.Api.csproj --configuration Release --output ./publish-backend

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish-backend

  # =========================================================================
  # 2. DEPLOY FRONTEND: Next.js -> Azure Static Web Apps
  # =========================================================================
  deploy-frontend:
    name: Deploy Frontend (Next.js -> Azure Static Web Apps)
    runs-on: ubuntu-latest
    needs: [deploy-backend] # Runs after backend is deployed

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend/bopis-retail-web"
          api_location: ""
          output_location: ""
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://omnistore-api.azurewebsites.net/api' }}
