name: OmniStore CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-backend:
    name: Build & Publish .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend/BopisRetail.Api.csproj

      - name: Build Backend (Release)
        run: dotnet build backend/BopisRetail.Api.csproj --configuration Release --no-restore

      - name: Publish Backend Package
        run: dotnet publish backend/BopisRetail.Api.csproj --configuration Release --no-build --output ./publish-backend

      - name: Upload Backend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ./publish-backend

  build-and-test-frontend:
    name: Build Next.js Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/bopis-retail-web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend/bopis-retail-web
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: frontend/bopis-retail-web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5050/api
